server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /data-deletion {
        try_files /data-deletion.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
