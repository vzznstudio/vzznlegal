server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Old flat URLs -> hub (each app now has its own pages)
    location = /privacy       { return 301 /; }
    location = /terms         { return 301 /; }
    location = /data-deletion { return 301 /; }

    # Clean URLs: /postiz/privacy -> /postiz/privacy.html ; /postiz -> /postiz/
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
